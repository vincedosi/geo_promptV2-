[project]
name = "optimisation"
version = "0.1.0"
description = "dentsu.explore — service d'optimisation (plan initial, correction quotidienne, adaptateurs DSP)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optimisation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textes en français : apostrophes et guillemets typographiques voulus
    "N818",  # exceptions nommées en français (`BaseIndisponible`), pas de suffixe `Error`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
