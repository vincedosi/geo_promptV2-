[project]
name = "geomatik-bidding-ml"
version = "0.1.0"
description = "GEOMATIK Bidding ML service deployed on Modal (Hoeffding Adaptive Tree)"
requires-python = ">=3.11"
dependencies = [
  "modal>=0.66",
  "river>=0.21",
  "supabase>=2.10.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "S301"]
