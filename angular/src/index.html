<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>dentsu.explore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="dentsu-favicon.svg">
  <!--
    Ni feuille globale ni polices ici : le shell AIDA, qui possède index.html,
    ne l'exécuterait pas. Polices et feuille globale sont chargées par
    DemarrageService, résolues contre l'application distante. Le preconnect,
    sans effet dans AIDA, fait gagner la poignée de main en autonome.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!--
    Isolation CSS : l'interface vit dans des racines d'ombre qui ADOPTENT
    magelian.css. Ce lien-ci ne pose que le fond et la hauteur du document
    autonome (styles/document.css) ; le shell AIDA ne l'exécute jamais.
  -->
  <link rel="stylesheet" href="magelian-document.css">
  <!--
    Thème posé AVANT le premier affichage, comme themeInitScript côté React
    (app/layout.tsx) : ThemeService (core/theme/) n'applique la classe
    light/dark qu'après le bootstrap Angular (config + session), donc sans ce
    script un utilisateur en thème clair voit le fond sombre le temps du
    démarrage. ThemeService reste la source de vérité ENSUITE — ce script ne
    fait que l'anticiper, avec la même clé de stockage (magelian-theme) et le
    même défaut (dark) qu'elle. ⚠ Dans le shell AIDA, c'est LUI qui possède
    index.html : ce script ne s'exécutera pas, et l'hôte pose lui-même la classe
    que ThemeService suit (voir sa JSDoc).
  -->
  <script>
    (function () {
      // `color-scheme` suit la classe : la feuille globale arrive en différé, et
      // sans lui le navigateur peint son canevas BLANC en thème sombre.
      var theme = 'dark';
      try {
        theme = localStorage.getItem('magelian-theme') === 'light' ? 'light' : 'dark';
      } catch (e) {}
      document.documentElement.classList.add(theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <mg-root></mg-root>
</body>
</html>
