<!-- Plein écran, hors coquille (comme /map en React) : toute la hauteur de la racine, qui défile si l'écran est court. -->
<div class="flex h-full flex-col overflow-auto bg-page">
  <mg-barre-progression />
  <div class="flex flex-1 flex-col gap-4 p-6">
    <header class="flex items-start justify-between gap-4">
      <div>
        <mg-entete-page titre="Essai carte" sousTitre="Zones de risque, sites et courbe de couverture, sur les vraies données." class="mb-0!" />
      </div>
      <!-- Sans barre latérale, il faut un chemin de retour. Lien RELATIF : le préfixe de montage est inconnu.
           Échafaudage de la PAGE D'ESSAI, pas un patron : les vraies routes carte/risque n'auront pas de lien « Accueil ». -->
      <a routerLink=".." class="rounded-md border-fin border-default px-3 py-1.5 text-xs text-secondary transition-colors hover:border-hover hover:bg-elevated hover:text-primary">Accueil</a>
    </header>

    @if (erreurCarte(); as message) {
      <p role="alert" class="text-xs text-danger">{{ message }}</p>
    }
    <mg-carte [cadre]="cadre" (prete)="surCartePrete($event)" (erreur)="erreurCarte.set($event)"
              class="block min-h-[320px] w-full flex-1 border-fin border-subtle" />
    @if (erreurZones(); as message) {
      <p role="alert" class="text-xs text-danger">{{ message }}</p>
    }
    @if (erreurSites(); as message) {
      <p role="alert" class="text-xs text-danger">{{ message }}</p>
    }

    @if (erreurCourbe(); as message) {
      <p role="alert" class="text-xs text-danger">{{ message }}</p>
    } @else {
      <div class="flex gap-8">
        <mg-kpi libelle="Habitants à moins de 5 km" [valeur]="habitants5km()"
                note="Pré-calcul carroyé INSEE, seuil haut seul" />
        <mg-kpi libelle="Sites Seveso seuil haut" [valeur]="nbSites()"
                note="Pré-calcul carroyé INSEE, seuil haut seul" />
      </div>
      <mg-courbe libelle="Population couverte selon le rayon autour des sites Seveso seuil haut"
                 [series]="series()" [formaterX]="formaterX" [formaterY]="formaterY"
                 [repere]="repere" [domaineX]="domaineX()" />
    }
  </div>
</div>
