<div class="flex h-full">
  <nav class="w-60 shrink-0 flex flex-col bg-surface border-r-fin border-subtle" aria-label="Navigation principale">
    <div class="px-4 py-4">
      <mg-logo class="h-[18px]" />
    </div>
    <a routerLink="./" routerLinkActive="bg-overlay text-primary border-l-2 border-primary"
       [routerLinkActiveOptions]="{ exact: true }"
       class="px-4 py-2 text-[13px] text-secondary border-l-2 border-transparent">
      Accueil
    </a>
    <a routerLink="catalogue" routerLinkActive="bg-overlay text-primary border-l-2 border-primary"
       class="px-4 py-2 text-[13px] text-secondary border-l-2 border-transparent">
      Catalogue
    </a>
    <a routerLink="essai-carte" routerLinkActive="bg-overlay text-primary border-l-2 border-primary"
       class="px-4 py-2 text-[13px] text-secondary border-l-2 border-transparent">
      Essai carte
    </a>
    <div class="mt-auto px-4 py-3 border-t-fin border-subtle flex flex-col gap-2">
      <span class="font-mono text-[11px] text-tertiary truncate">{{ email() }}</span>
      <button type="button" (click)="theme.basculer()"
              class="self-start text-xs text-secondary hover:text-primary">
        {{ theme.theme() === 'dark' ? 'Thème clair' : 'Thème sombre' }}
      </button>
      <button type="button" (click)="deconnecter()"
              class="self-start text-xs text-secondary hover:text-primary">
        Se déconnecter
      </button>
    </div>
  </nav>
  <main class="flex-1 min-w-0 overflow-auto bg-page">
    <router-outlet />
  </main>
</div>
